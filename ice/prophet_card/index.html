<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css">
        <title>Prophet Card</title>
    </head>
    <body>
        <div id="card-content">
            <h1 id="big-title">
                Dallin H. Oaks
            </h1>
            <p id="sub-title">
                18th President of <a href="https://www.churchofjesuschrist.org/?lang=eng">
                    the Church of Jesus Christ of Latter-day Saints
                </a> 
            </p>
            <div id="img-holder">
                <img id="prophet-img" src="dallin_oaks.webp" alt="The Living Prophet">
            </div>
           <div id="the-list">
                <ul>
                    <li>Born: Aug 12, 1932</li>
                    <li>Apostle: Apr 7, 1984</li>
                    <li>Prophet: Oct 14, 2025</li>
                </ul>
           </div>
           <div id="the-quote">
                <p class="permanent-marker">
                    "The gospel of Jesus Christ teaches us 
                    that our highest priority is to love 
                    God and to love our fellowmen."
                </p>
           </div>
        </div>
    </body>
</html>
